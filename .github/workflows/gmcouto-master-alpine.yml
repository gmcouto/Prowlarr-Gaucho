name: gmcouto-master Alpine

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: gmcouto-master-alpine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  DOTNET_VERSION: '10.0.404'
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fetch all tags
        run: git fetch --force --tags origin

      - name: Resolve upstream version
        id: version
        run: |
          VERSION=$(git log --grep='^Merge.*for master [0-9][0-9.]*$' --format=%s -1 | sed -n 's/.*for master \([0-9][0-9.]*\)$/\1/p')
          if [ -z "$VERSION" ]; then
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null | sed 's/^v//')
          fi
          if [ -z "$VERSION" ]; then
            echo "Could not resolve upstream version from master branch history."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building Prowlarr ${VERSION} (gmcouto master)"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn

      - name: Enable Yarn
        run: corepack enable

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Build frontend
        run: ./build.sh --frontend
        env:
          FORCE_COLOR: '0'
          PROWLARRVERSION: ${{ steps.version.outputs.version }}
          BUILD_SOURCEBRANCHNAME: master

      - name: Build musl backend (x64 + arm64)
        run: |
          dotnet msbuild -restore src/Prowlarr.sln \
            -p:SelfContained=True \
            -p:Configuration=Release \
            -p:Platform=Posix \
            -p:RuntimeIdentifiers=linux-musl-x64\;linux-musl-arm64 \
            -t:PublishAllRids
        env:
          PROWLARRVERSION: ${{ steps.version.outputs.version }}
          BUILD_SOURCEBRANCHNAME: master

      - name: Package musl builds
        run: |
          ./build.sh --packages -f net10.0 -r linux-musl-x64
          ./build.sh --packages -f net10.0 -r linux-musl-arm64
          find _artifacts -name Prowlarr -exec chmod a+x {} \;
          find _artifacts -name Prowlarr.Update -exec chmod a+x {} \;
        env:
          PROWLARRVERSION: ${{ steps.version.outputs.version }}
          BUILD_SOURCEBRANCHNAME: master

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/alpine/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PROWLARR_VERSION=${{ steps.version.outputs.version }}
          provenance: false

      - name: Tag release version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists; skipping tag."
          else
            git tag -a "${TAG}" -m "gmcouto release ${VERSION} (upstream + langsubs + mergeheader + infra)"
            git push origin "${TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          NOTES="Built from upstream Prowlarr ${VERSION} with cardigann/langsubs and gmcouto/mergeheader.

          Docker: \`ghcr.io/gmcouto/prowlarr:${VERSION}\`"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$VERSION" --notes "$NOTES"
          else
            gh release create "$TAG" --title "$VERSION" --notes "$NOTES"
          fi

